name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://bank:bank@localhost:5432/bank_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Проверка миграций на чистой БД
        env:
          PGPASSWORD: bank
          DATABASE_URL: postgresql+psycopg://bank:bank@localhost:5432/bank_migrations
        run: |
          psql -h localhost -U bank -d postgres -c "CREATE DATABASE bank_migrations"
          alembic upgrade head
      - run: pytest
